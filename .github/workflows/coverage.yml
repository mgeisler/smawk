name: coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          # Avoid PRs filling up the cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage for no default features
        run: cargo llvm-cov test --locked --no-report --no-default-features

      - name: Coverage for all features
        run: cargo llvm-cov test --locked --no-report --all-features

      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
