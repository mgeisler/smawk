name: build

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        rust:
          - stable
          - nightly

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ${{ matrix.rust }} Rust
        run: rustup default ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Avoid PRs filling up the cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Quick smoke test to detect serious brokenness.
      - name: Build with default features
        run: cargo build

      - name: Run tests with default features
        run: cargo test

      - name: Build with all features
        run: cargo build --all-features

      # Restrict to nightly since benchmarks only work there.
      - name: Build all targets with all features
        if: matrix.rust == 'nightly'
        run: cargo build --all-targets --all-features

      - name: Run tests with all features
        run: cargo test --all-features

  no_std:
    name: Build and Test (no_std)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install no_std target
        run: rustup target add thumbv7m-none-eabi

      - uses: Swatinem/rust-cache@v2
        with:
          # Avoid PRs filling up the cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check no_std compatibility (default features)
        run: cargo check --target thumbv7m-none-eabi --no-default-features

      - name: Check no_std compatibility (all features)
        run: cargo check --target thumbv7m-none-eabi --all-features

  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # We use an unstable rustfmt feature and we thus need the
      # nightly channel to enforce the formatting.
      - name: Setup Rust nightly
        run: rustup default nightly

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check Formatting
        uses: dprint/check@v2.3
